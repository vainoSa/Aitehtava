<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Snake 🐍</h1>
    <div id="aloitusruutu">
        <button id="startButton">Aloita peli</button>
    </div>
    <div id="pelialue" hidden>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p><strong>Pisteet:</strong> <span id="info">0</span></p>
    <p><strong>Ennätys 🥇:</strong> <span id="ennatus">0</span></p>
    </div>
    <div id="gameOver" hidden>
        <h2>Game over</h2>
        <p id="finalScore"></p>
        <button id="restartButton">Aloita uudelleen</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
